<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese Character Flashcards</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#17202a; --muted:#68727d; --accent:#2563eb; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Arial,system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width:900px; margin:0 auto; padding:24px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  h1 { margin:0 0 6px; font-size:28px; }
  .sub { color:var(--muted); }
  .controls { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0; }
  select, button { border:1px solid #ccd3da; border-radius:10px; padding:10px 14px; background:white; font-size:15px; cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .progress { color:var(--muted); margin-bottom:10px; }
  .card { height:430px; perspective:1000px; cursor:pointer; }
  .inner { position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d; }
  .card.flipped .inner { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:24px; background:var(--card); box-shadow:0 12px 35px rgba(0,0,0,.10); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center; }
  .back { transform:rotateY(180deg); }
  .word { font-size:110px; line-height:1.1; font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif; }
  .pinyin { font-size:40px; margin-top:22px; }\n  .meaning { font-size:27px; margin-top:14px; color:#334155; }
  .hint { color:var(--muted); margin-top:18px; }
  .lesson { position:absolute; top:20px; left:24px; color:var(--muted); font-size:14px; }
  .nav { display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .nav button { min-width:110px; }
  .rating, .statusControls { display:flex; justify-content:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .rating button { min-width:150px; }
  .statusControls select, .statusControls button { min-width:190px; }
  .rating button.active { border-color:var(--accent); box-shadow:0 0 0 2px rgba(37,99,235,.12); }
  .small { font-size:13px; color:var(--muted); text-align:center; margin-top:18px; line-height:1.5; }
  @media(max-width:600px) {
    .card { height:360px; }
    .word { font-size:78px; }
    .pinyin { font-size:30px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Chinese Character Flashcards</h1>
      <div class="sub">Click the card to reveal the pinyin.</div>
    </div>
  </header>

  <div class="controls">
    <select id="lesson"></select>
    <button id="shuffle">Shuffle</button>
    <button id="reset">Reset</button>
  </div>

  <div class="progress" id="progress"></div>

  <div class="card" id="card" tabindex="0" aria-label="Flashcard">
    <div class="inner">
      <div class="face front">
        <div class="lesson" id="frontLesson"></div>
        <div class="word" id="frontWord"></div>
        <div class="hint">Click to reveal • then the next word appears automatically</div>
      </div>
      <div class="face back">
        <div class="lesson" id="backLesson"></div>
        <div class="word" id="backWord"></div>
        <div class="pinyin" id="backPinyin"></div>
        <div class="meaning" id="backMeaning"></div>
        <div class="hint">Next word in a moment…</div>
      </div>
    </div>
  </div>

  <div class="nav">
    <button id="prev">← Previous</button>
    <button class="primary" id="show">Show Answer</button>
    <button id="next">Next →</button>
  </div>

  <div class="rating">
    <button id="comfortable" title="Remove this card from normal review">✓ Comfortable</button>
    <button id="difficult" title="Keep this card marked for extra review">★ Difficult</button>
    <button id="clearDifficult" title="Remove the difficult mark from this card">☆ Clear Difficult</button>
  </div>

  <div class="statusControls">
    <select id="statusFilter" aria-label="Card status">
      <option value="ALL">All cards</option>
      <option value="DIFFICULT">★ Difficult only</option>
      <option value="COMFORTABLE">✓ Comfortable only</option>
    </select>
    <button id="resetComfortable">Reset Comfortable Marks</button>
  </div>

  <div class="small">
    Keyboard: ← / → to move &nbsp; • &nbsp; Space to flip &nbsp; • &nbsp; R to shuffle
  </div>
</div>

let deck = [...allCards];
let index = 0;

const COMFORTABLE_KEY = 'chineseFlashcards.comfortable.v1';
const DIFFICULT_KEY = 'chineseFlashcards.difficult.v1';

function loadSet(key) {
  try {
    const raw = localStorage.getItem(key);
    const parsed = raw ? JSON.parse(raw) : [];
    return new Set(Array.isArray(parsed) ? parsed : []);
  } catch {
    return new Set();
  }
}

function saveSet(key, set) {
  localStorage.setItem(key, JSON.stringify([...set]));
}

const comfortableCards = loadSet(COMFORTABLE_KEY);
const difficultCards = loadSet(DIFFICULT_KEY);

function cardKey(card) {
  return `${card.lesson}|||${card.word}`;
}

const cardEl = document.getElementById('card');
const lessonEl = document.getElementById('lesson');
const statusFilterEl = document.getElementById('statusFilter');
const frontWord = document.getElementById('frontWord');
const frontLesson = document.getElementById('frontLesson');
const backWord = document.getElementById('backWord');
const backLesson = document.getElementById('backLesson');
const backPinyin = document.getElementById('backPinyin');
const backMeaning = document.getElementById('backMeaning');
const progress = document.getElementById('progress');
const comfortableBtn = document.getElementById('comfortable');
const difficultBtn = document.getElementById('difficult');
const clearDifficultBtn = document.getElementById('clearDifficult');
const showBtn = document.getElementById('show');

const lessons = [...new Set(allCards.map(x => x.lesson))];
lessonEl.innerHTML = '<option value="ALL">All lessons (' + allCards.length + ')</option>' +
  lessons.map(x => '<option value="' + x.replaceAll('"','&quot;') + '">' + x + '</option>').join('');

function getBaseDeck() {
  const lesson = lessonEl.value;
  let cards = lesson === 'ALL' ? [...allCards] : allCards.filter(x => x.lesson === lesson);

  const status = statusFilterEl.value;
  if (status === 'DIFFICULT') {
    cards = cards.filter(x => difficultCards.has(cardKey(x)) && !comfortableCards.has(cardKey(x)));
  } else if (status === 'COMFORTABLE') {
    cards = cards.filter(x => comfortableCards.has(cardKey(x)));
  } else {
    // Comfortable cards disappear from normal review.
    cards = cards.filter(x => !comfortableCards.has(cardKey(x)));
  }
  return cards;
}

function randomize(cards) {
  for (let i=cards.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]]=[cards[j],cards[i]];
  }
  return cards;
}

function buildDeck() {
  deck = randomize(getBaseDeck());
  index = 0;
  render();
}

function updateCardContent() {
  if (!deck.length) {
    frontWord.textContent = '🎉';
    backWord.textContent = '';
    frontLesson.textContent = '';
    backLesson.textContent = '';
    backPinyin.textContent = '';
    backMeaning.textContent = 'No cards in this view';
    progress.textContent = '0 / 0';
    showBtn.textContent = 'Show Answer';
    comfortableBtn.disabled = true;
    difficultBtn.disabled = true;
    clearDifficultBtn.disabled = true;
    return;
  }

  const c = deck[index];
  const key = cardKey(c);
  frontWord.textContent = c.word;
  backWord.textContent = c.word;
  frontLesson.textContent = c.lesson;
  backLesson.textContent = c.lesson;
  backPinyin.textContent = c.pinyin || "Pinyin unavailable";
  backMeaning.textContent = c.meaning || "Meaning unavailable";
  progress.textContent = `${index+1} / ${deck.length}`;
  showBtn.textContent = 'Show Answer';
  comfortableBtn.disabled = false;
  difficultBtn.disabled = false;
  clearDifficultBtn.disabled = !difficultCards.has(key);
  difficultBtn.classList.toggle('active', difficultCards.has(key));
  comfortableBtn.classList.toggle('active', comfortableCards.has(key));
}

function render() {
  clearAutoNextTimer();
  clearTransitionTimer();
  cardEl.classList.remove('flipped');
  updateCardContent();
}

let autoNextTimer = null;
let transitionTimer = null;

function clearAutoNextTimer() {
  if (autoNextTimer) {
    clearTimeout(autoNextTimer);
    autoNextTimer = null;
  }
}

function clearTransitionTimer() {
  if (transitionTimer) {
    clearTimeout(transitionTimer);
    transitionTimer = null;
  }
}

function isCurrentViewNormal() {
  return statusFilterEl.value === 'ALL';
}

function findNextIndex(startIndex, direction) {
  if (!deck.length) return -1;

  let candidate = ((startIndex % deck.length) + deck.length) % deck.length;
  for (let checked = 0; checked < deck.length; checked++) {
    const c = deck[candidate];
    const shouldSkip = isCurrentViewNormal() && comfortableCards.has(cardKey(c));
    if (!shouldSkip) return candidate;
    candidate = (candidate + direction + deck.length) % deck.length;
  }
  return -1;
}

function moveTo(indexChange) {
  if (!deck.length) return;
  clearAutoNextTimer();
  clearTransitionTimer();

  const direction = indexChange >= 0 ? 1 : -1;
  let newIndex = findNextIndex(index + direction, direction);
  if (newIndex === -1) {
    // No cards remain in the current normal view.
    updateCardContent();
    return;
  }

  const wasFlipped = cardEl.classList.contains('flipped');

  if (!wasFlipped) {
    index = newIndex;
    updateCardContent();
    return;
  }

  // Start the flip-back. Change the word only when the card is edge-on,
  // so the user never sees the old face turn all the way before the new word appears.
  cardEl.classList.remove('flipped');
  showBtn.textContent = 'Show Answer';

  transitionTimer = setTimeout(() => {
    index = newIndex;
    updateCardContent();
    transitionTimer = null;
  }, 225);
}

function flip() {
  if (!deck.length) return;
  clearAutoNextTimer();

  const isFlipped = cardEl.classList.contains('flipped');
  if (!isFlipped) {
    cardEl.classList.add('flipped');
    showBtn.textContent = 'Next →';
    autoNextTimer = setTimeout(() => {
      next();
      autoNextTimer = null;
    }, 5000);
  } else {
    next();
  }
}

function next() { moveTo(1); }
function prev() { moveTo(-1); }

function markComfortable() {
  if (!deck.length) return;
  clearAutoNextTimer();
  clearTransitionTimer();

  const current = deck[index];
  const key = cardKey(current);
  comfortableCards.add(key);
  difficultCards.delete(key);
  saveSet(COMFORTABLE_KEY, comfortableCards);
  saveSet(DIFFICULT_KEY, difficultCards);

  // Stay on the current card. It will be skipped the next time you move.
  comfortableBtn.classList.add('active');
  difficultBtn.classList.remove('active');
  clearDifficultBtn.disabled = true;
}

function markDifficult() {
  if (!deck.length) return;
  clearAutoNextTimer();
  clearTransitionTimer();

  const current = deck[index];
  const key = cardKey(current);
  difficultCards.add(key);
  comfortableCards.delete(key);
  saveSet(DIFFICULT_KEY, difficultCards);
  saveSet(COMFORTABLE_KEY, comfortableCards);

  // Stay on the current card after marking it.
  difficultBtn.classList.add('active');
  comfortableBtn.classList.remove('active');
  clearDifficultBtn.disabled = false;
}

function clearDifficult() {
  if (!deck.length) return;
  const current = deck[index];
  difficultCards.delete(cardKey(current));
  saveSet(DIFFICULT_KEY, difficultCards);
  updateCardContent();
}

lessonEl.addEventListener('change', buildDeck);
statusFilterEl.addEventListener('change', buildDeck);

document.getElementById('shuffle').onclick = () => {
  randomize(deck);
  index = 0;
  render();
};

document.getElementById('reset').onclick = () => {
  lessonEl.value='ALL';
  statusFilterEl.value='ALL';
  buildDeck();
};

document.getElementById('resetComfortable').onclick = () => {
  if (!comfortableCards.size) return;
  if (confirm('Remove all Comfortable marks and put those cards back into normal review?')) {
    comfortableCards.clear();
    saveSet(COMFORTABLE_KEY, comfortableCards);
    buildDeck();
  }
};

document.getElementById('prev').onclick=prev;
document.getElementById('next').onclick=next;
showBtn.onclick=flip;
comfortableBtn.onclick=markComfortable;
difficultBtn.onclick=markDifficult;
clearDifficultBtn.onclick=clearDifficult;
cardEl.onclick=flip;
cardEl.onkeydown=e => {
  if(e.key==='Enter'||e.key===' ') {e.preventDefault();flip();}
};

document.addEventListener('keydown', e => {
  if(e.target.tagName==='SELECT' || e.target.tagName==='BUTTON') return;
  if(e.key==='ArrowRight') next();
  else if(e.key==='ArrowLeft') prev();
  else if(e.key===' ') {e.preventDefault();flip();}
  else if(e.key.toLowerCase()==='r') {
    randomize(deck);
    index=0;
    render();
  }
});

buildDeck();
</script>
</body>
</html>
